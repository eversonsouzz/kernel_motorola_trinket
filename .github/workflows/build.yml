name: Build Kernel Clang

on:
  workflow_dispatch:
  push:
    branches:
      - eleven

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Compilation Environment
        run: |
          # Redireciona os mirrors instáveis da Azure para os servidores principais da Canonical
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev make git python3 build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu wget

      - name: Setup Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang
          wget https://github.com/prabhatkrmishra/android-kernel-tools/releases/download/clang-r353983c/clang-r353983c.gz
          tar -xvzf clang-r353983c.gz
          cd ../..

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        run: |
          # Adiciona o Clang ao PATH conforme as diretrizes do ClangBuiltLinux
          CLANG_DIR="$PWD/toolchain/clang"
          export PATH="$CLANG_DIR/bin:${PATH}"
          
          mkdir -p out
          
          # Gera a árvore de configuração para a plataforma Sofia
          make O=out ARCH=arm64 vendor/sofiar_defconfig
          
          # Compila o código C com Clang e delega a montagem/linkagem para o Binutils (ld.bfd)
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
