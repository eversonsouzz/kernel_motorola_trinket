name: Build Kernel Clang

on:
  workflow_dispatch:
  push:
    branches:
      - eleven

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Compilation Environment
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev make git python3 build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu wget

      - name: Setup Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang
          wget https://github.com/prabhatkrmishra/android-kernel-tools/releases/download/clang-r353983c/clang-r353983c.gz
          tar -xvzf clang-r353983c.gz
          cd ../..

      - name: Integration, Patch & Build
        run: |
          CLANG_DIR="$PWD/toolchain/clang"
          export PATH="$CLANG_DIR/bin:${PATH}"
          
          # Limpeza de dependencias RTIC do defconfig e codigo fonte
          sed -i '/CONFIG_.*_RTIC/d' arch/arm64/configs/vendor/sofiar_defconfig
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.S" \) ! -path "./out/*" -exec sed -i -e 's/\.bss\.rtic/\.bss/g' -e 's/\.data\.rtic/\.data/g' -e 's/\.rtic//g' {} +
          sed -i 's/config KALLSYMS_BASE_RELATIVE/config KALLSYMS_BASE_RELATIVE\n\tdepends on BROKEN/g' init/Kconfig
          
          # --- INTEGRACAO NOMOUNT (maxsteeel/nomount) ---
          echo "Integrando NoMount ao Kernel..."
          git clone https://github.com/maxsteeel/nomount.git nomount_tmp
          
          # Passo 1: Aplicar o Patch de Hooks do NoMount
          if ls nomount_tmp/kernel/*.patch 1> /dev/null 2>&1; then
            echo "Aplicando patch principal do NoMount..."
            patch -p1 < nomount_tmp/kernel/*.patch || echo "Aviso: Patch aplicado com offsets ou ja integrado."
          elif ls nomount_tmp/kernel/patch/*.patch 1> /dev/null 2>&1; then
            patch -p1 < nomount_tmp/kernel/patch/*.patch || echo "Aviso: Patch aplicado com offsets."
          fi

          # Passo 2: Copiar fontes diretamente para fs/
          if [ -d "nomount_tmp/kernel/src" ]; then
            cp -r nomount_tmp/kernel/src/* fs/
          fi
          rm -rf nomount_tmp

          mkdir -p out
          make O=out ARCH=arm64 vendor/sofiar_defconfig
          chmod +x scripts/config

          # --- CONFIGURACOES DE SEGURANCA E ESTABILIDADE ---
          ./scripts/config --file out/.config --disable MSM_RTIC
          ./scripts/config --file out/.config --disable QCACLD_RTIC
          ./scripts/config --file out/.config --disable SELINUX_RTIC
          ./scripts/config --file out/.config --disable KALLSYMS_BASE_RELATIVE

          # --- HABILITANDO NOMOUNT E NAMESPACES ---
          ./scripts/config --file out/.config --enable CONFIG_NOMOUNT
          ./scripts/config --file out/.config --enable CONFIG_NAMESPACES
          ./scripts/config --file out/.config --enable CONFIG_USER_NS
          ./scripts/config --file out/.config --enable CONFIG_PID_NS
          ./scripts/config --file out/.config --enable CONFIG_NET_NS

          # --- COMPRESSAO ZSTD NA ZRAM ---
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_ZSTD
          ./scripts/config --file out/.config --enable CONFIG_ZSTD_COMPRESS
          ./scripts/config --file out/.config --enable CONFIG_ZSTD_DECOMPRESS
          ./scripts/config --file out/.config --enable CONFIG_ZRAM_WRITEBACK
          ./scripts/config --file out/.config --enable CONFIG_ZRAM_DEF_COMP_ZSTD
          ./scripts/config --file out/.config --set-str CONFIG_ZRAM_DEF_COMP "zstd"

          # --- CONFIGURACAO RESUKISU-ULTRA ---
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          
          if [ -d drivers/kernelsu ]; then
            echo "Redirecionando pasta base do ReSukiSU para /metadata/ksu..."
            grep -rnw 'drivers/kernelsu' -e '/data/adb/ksu' | cut -d: -f1 | sort -u | xargs -r sed -i 's|/data/adb/ksu|/metadata/ksu|g'
          fi

          # Syscall hook patch
          curl https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/syscall_hook_patches.sh | bash
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK

          # Sincroniza e valida a estrutura final do .config
          make O=out ARCH=arm64 olddefconfig
          
          # Compilacao
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-fno-pic -fno-pie"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
