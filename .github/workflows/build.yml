Name: Build Kernel Clang

on:
  workflow_dispatch:
  push:
    branches:
      - eleven

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Compilation Environment
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev make git python3 build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu wget

      - name: Setup Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang
          wget https://github.com/prabhatkrmishra/android-kernel-tools/releases/download/clang-r353983c/clang-r353983c.gz
          tar -xvzf clang-r353983c.gz
          cd ../..

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Patch RTIC Dependencies & Build
        run: |
          CLANG_DIR="$PWD/toolchain/clang"
          export PATH="$CLANG_DIR/bin:${PATH}"
          
          # Desabilita o RTIC nas regras do Kconfig e do defconfig antes de gerar o .config
          find . -type f -name "Kconfig*" -exec sed -i 's/default y/default n/g' {} + || true
          sed -i 's/CONFIG_SELINUX_RTIC=y/CONFIG_SELINUX_RTIC=n/g' arch/arm64/configs/vendor/sofiar_defconfig || true
          sed -i 's/CONFIG_MSM_RTIC=y/CONFIG_MSM_RTIC=n/g' arch/arm64/configs/vendor/sofiar_defconfig || true
          
          mkdir -p out
          
          # Gera a árvore de configuração
          make O=out ARCH=arm64 vendor/sofiar_defconfig
          
          # Garante o desligamento direto no .config final
          scripts/config --file out/.config --disable CONFIG_MSM_RTIC
          scripts/config --file out/.config --disable CONFIG_QCACLD_RTIC
          scripts/config --file out/.config --disable CONFIG_SELINUX_RTIC
          
          make O=out ARCH=arm64 olddefconfig
          
          # Compila instruindo o Clang a não usar código de posição independente (PIC/PIE)
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-fno-pic -fno-pie"
