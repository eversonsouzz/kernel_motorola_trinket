name: Build Kernel Clang

on:
  workflow_dispatch:
  push:
    branches:
      - eleven

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Compilation Environment
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev make git python3 build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu wget

      - name: Setup Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang
          wget https://github.com/prabhatkrmishra/android-kernel-tools/releases/download/clang-r353983c/clang-r353983c.gz
          tar -xvzf clang-r353983c.gz
          cd ../..

      - name: Patch RTIC Dependencies & Build
        run: |
          CLANG_DIR="$PWD/toolchain/clang"
          export PATH="$CLANG_DIR/bin:${PATH}"
          
          # Remove linhas de RTIC do defconfig da fabricante
          sed -i '/CONFIG_.*_RTIC/d' arch/arm64/configs/vendor/sofiar_defconfig
          
          # Limpa secoes .rtic do codigo fonte sem afetar o .git ou pasta out
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.S" \) ! -path "./out/*" -exec sed -i -e 's/\.bss\.rtic/\.bss/g' -e 's/\.data\.rtic/\.data/g' -e 's/\.rtic//g' {} +
          
          # Forca a remocao do KALLSYMS_BASE_RELATIVE na raiz da regra Kconfig
          sed -i 's/config KALLSYMS_BASE_RELATIVE/config KALLSYMS_BASE_RELATIVE\n\tdepends on BROKEN/g' init/Kconfig
          
          mkdir -p out
          
          # Gera a arvore de configuracao inicial
          make O=out ARCH=arm64 vendor/sofiar_defconfig
          
          # Garante permissao de execucao no script de config
          chmod +x scripts/config
          
          # Desativa o RTIC no .config gerado
          ./scripts/config --file out/.config --disable MSM_RTIC
          ./scripts/config --file out/.config --disable QCACLD_RTIC
          ./scripts/config --file out/.config --disable SELINUX_RTIC
          
          # Desativa kallsyms relativo para corrigir o estouro de tabela de simbolos
          ./scripts/config --file out/.config --disable KALLSYMS_BASE_RELATIVE
          
          # Setup ReSukiSU-Ultra
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          
          # Apply Patch PR #205 (Fix ENOKEY filp_open in kworker for FBE legacy kernels)
          if [ -d drivers/kernelsu ]; then
            echo "Aplicando Patch PR #205 no KernelSU..."
            cd drivers/kernelsu
            
            # Injecao direta da instalacao do keyring no kworker/ksu_core
            sed -i '/#include <linux\/sched.h>/a #include <linux\/key.h>' kernel/ksu.c 2>/dev/null || true
            sed -i '/#include <linux\/sched.h>/a #include <linux\/cred.h>' kernel/ksu.c 2>/dev/null || true
            
            # Aplica o patch no arquivo ksu.c ou ksud.c dependendo da estrutura da arvore
            find . -type f -name "ksu.c" -o -name "ksud.c" -o -name "allowlist.c" | xargs sed -i '/ksu_core_init/a \    install_session_keyring_to_coords(find_task_by_vpid(1), NULL);' 2>/dev/null || true
            
            cd ../..
          fi

          # Add syscall hook
          curl https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/syscall_hook_patches.sh | bash
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK

          # Sincroniza e valida a estrutura final do .config
          make O=out ARCH=arm64 olddefconfig
          
          # Compilacao
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-fno-pic -fno-pie"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
